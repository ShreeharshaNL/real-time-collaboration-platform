version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: collab-redis
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7.0
    container_name: collab-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword

  server:
    build: ./server
    container_name: collab-api-server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://root:rootpassword@mongo:27017/collab_db?authSource=admin
      JWT_SECRET: supersecretjwtkeyforcollabplatform
    depends_on:
      - redis
      - mongo
